# Optional: bind KV for live registry updates without redeploy
# [[kv_namespaces]]
# binding = "SITE_REGISTRY"
# id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets (wrangler secret put):
#   FRESHDESK_API_KEY
#   FRESHDESK_DOMAIN          tall-help.freshdesk.com (native host; the vanity
#                             domain help.tall.agency does not serve the API)
#   CURSOR_TOKEN_PLAN         per-automation token; Cursor scopes each token to
#   CURSOR_TOKEN_IMPLEMENT    one automation, so these cannot be shared
#   CURSOR_TOKEN_REOPENED_NUDGE
#   ROUTER_ACTION_SECRET      agent -> Worker /actions/* auth (not a Cursor token)
# Optional:
#   WEBHOOK_SHARED_SECRET     if Freshdesk sends a shared secret header
